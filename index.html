<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bữa sáng ngẫu nhiên | Lucky Wheel</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="header-inner">
          <div class="brand">
            <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
            </svg>
            <span>Bữa sáng ngẫu nhiên</span>
          </div>
          <button
            type="button"
            id="btnAddFromHeader"
            class="btn-header-action"
            data-tooltip="Thêm món"
            data-tooltip-position="bottom"
            aria-label="Thêm món"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            <svg class="icon icon-bowl" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>
            <span>Thêm món</span>
          </button>
        </div>
      </header>

      <main class="main">
        <!-- Home view -->
        <section
          id="view-home"
          class="view view-active"
          aria-label="Trang danh sách món"
        >
          <section class="food-list-section">
            <header class="section-header">
              <div>
                <h2>Danh sách món ăn</h2>
                <p class="hint">
                  Hiển thị tối đa 5 món gần nhất. Bấm xem thêm để xem toàn bộ.
                </p>
              </div>
            </header>

            <div class="food-list-scroll">
              <ul id="homeFoodList" class="food-list"></ul>
            </div>

            <div class="home-actions">
              <div id="homePagination" class="pagination" hidden></div>
              <button
                type="button"
                id="btnViewMore"
                class="btn-secondary"
                hidden
                data-tooltip="Xem thêm"
                data-tooltip-position="bottom"
                aria-label="Xem thêm"
              >
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
                <span>Xem thêm</span>
              </button>
            </div>
          </section>
        </section>

        <!-- Add food view -->
        <section id="view-add" class="view" aria-label="Trang thêm món">
          <section class="card">
            <header class="section-header">
              <div>
                <h2>Thêm món ăn</h2>
                <p class="hint">
                  Chỉ cần điền tên món, các thông tin khác có thể bổ sung sau.
                </p>
              </div>
            </header>

            <form id="addFoodForm" class="form">
              <div class="form-group required">
                <label for="fieldTitle">Tên món</label>
                <input
                  type="text"
                  id="fieldTitle"
                  name="title"
                  maxlength="80"
                  required
                  placeholder="VD: Phở bò tái chín"
                />
              </div>

              <div class="form-group">
                <label for="fieldDescription">Mô tả</label>
                <textarea
                  id="fieldDescription"
                  name="description"
                  rows="3"
                  placeholder="VD: Quán sạch, nước dùng thanh, mở từ 6h sáng."
                ></textarea>
              </div>

              <div class="form-group">
                <label for="fieldAddress">Địa chỉ</label>
                <input
                  type="text"
                  id="fieldAddress"
                  name="address"
                  maxlength="160"
                  placeholder="VD: 123 Lê Lợi, Q.1, TP.HCM"
                />
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label for="fieldPriceMin">Giá từ</label>
                  <input
                    type="number"
                    id="fieldPriceMin"
                    name="priceMin"
                    min="0"
                    step="1000"
                    placeholder="VD: 25000"
                  />
                </div>
                <div class="form-group">
                  <label for="fieldPriceMax">Đến</label>
                  <input
                    type="number"
                    id="fieldPriceMax"
                    name="priceMax"
                    min="0"
                    step="1000"
                    placeholder="VD: 40000"
                  />
                </div>
              </div>

              <p
                id="addFoodError"
                class="form-error"
                role="alert"
                aria-live="polite"
              ></p>

              <div class="form-actions">
                <button type="button" id="btnCancelAdd" class="btn-secondary" data-tooltip="Hủy" data-tooltip-position="bottom" aria-label="Hủy">
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                  <span>Hủy</span>
                </button>
                <button type="submit" id="btnSaveFood" class="btn-primary" data-tooltip="Lưu món" data-tooltip-position="bottom" aria-label="Lưu món">
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                  <span>Lưu món</span>
                </button>
              </div>
            </form>
          </section>
        </section>

        <!-- Wheel view -->
        <section
          id="view-wheel"
          class="view"
          aria-label="Trang chọn món ngẫu nhiên"
        >
          <section class="wheel-section">
            <div class="wheel-wrapper">
              <canvas
                id="wheel"
                width="420"
                height="420"
                aria-label="Bánh xe may mắn"
              ></canvas>
              <div class="wheel-pointer" aria-hidden="true">▲</div>
              <div id="wheelTooltip" class="wheel-tooltip" role="tooltip" aria-hidden="true"></div>
            </div>
            <button type="button" id="spinBtn" class="btn-spin" disabled aria-label="Quay">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
              <span>Quay</span>
            </button>
          </section>
        </section>
      </main>

      <!-- Floating random button -->
      <button
        type="button"
        id="btnOpenWheel"
        class="fab-random"
        data-tooltip="Chọn món ngẫu nhiên"
        data-tooltip-position="left"
        aria-label="Chọn món ngẫu nhiên"
      >
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
          <circle cx="12" cy="12" r="3" fill="currentColor" opacity="0.9"/>
        </svg>
        <svg class="icon icon-bowl" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>
      </button>

      <!-- Popup result -->
      <div id="resultModal" class="modal" aria-hidden="true">
        <div class="modal-backdrop"></div>
        <div
          class="modal-dialog"
          role="dialog"
          aria-modal="true"
          aria-labelledby="resultTitle"
        >
          <div class="modal-header">
            <h2 id="resultTitle">Hôm nay ăn gì?</h2>
          </div>
          <div class="modal-body">
            <p id="modalFoodTitle" class="modal-food-title"></p>
            <p id="modalFoodDescription" class="modal-food-description"></p>
            <p id="modalFoodAddress" class="modal-food-address"></p>
            <p id="modalFoodPrice" class="modal-food-price"></p>
          </div>
          <div class="modal-actions">
            <button type="button" id="btnCloseModal" class="btn-primary">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
              <span>Ngon, chốt món này!</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
